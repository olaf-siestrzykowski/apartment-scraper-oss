[pytest]
# Pytest configuration for apartment_scraper

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers for test categorization
markers =
    unit: Unit tests for individual functions
    integration: Integration tests combining multiple functions
    slow: Tests that take longer to execute

# Test paths
testpaths = tests

# Minimum Python version
minversion = 3.8
